<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="本地商品与库存演示：查看商品、选择数量、购买并更新库存。">
  <title>Shop · 商品与库存</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="topbar"><div class="brand">SHOP<span>商品与库存</span></div><span class="badge">LOCAL DEMO</span></header>
  <main>
    <div class="heading">
      <div><p class="eyebrow">INVENTORY / PURCHASE</p><h1>选购商品</h1><p class="intro">选择数量，购买后扣减本地库存。</p></div>
      <button id="refresh" class="secondary" type="button">刷新库存</button>
    </div>
    <p id="message" class="message" role="status" aria-live="polite">正在读取库存…</p>
    <section id="products" class="products" aria-label="商品列表" aria-busy="true"></section>
    <noscript><p class="message">请启用 JavaScript，或直接使用 HTTP API。</p></noscript>
    <footer><p>仅包含商品和库存，不涉及支付。重启服务会保留剩余库存。</p><a href="/products" target="_blank" rel="noopener">查看 HTTP 数据 <span aria-hidden="true">↗</span></a></footer>
  </main>
  <template id="product-template">
    <article class="product">
      <div class="product-top"><span class="product-id"></span><span class="availability">有货</span></div>
      <h2></h2>
      <div class="inventory"><span class="stock"></span><span class="unit">件可用</span></div>
      <form>
        <label class="quantity-label">购买数量<input class="quantity" type="number" min="1" step="1" value="1" required inputmode="numeric"></label>
        <button class="buy" type="submit">购买</button>
      </form>
    </article>
  </template>
</body>
</html>
